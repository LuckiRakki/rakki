name: Desktop

# Rakki desktop installers: Windows (an NSIS installer with mpv inside) and Linux (an
# AppImage, and a .deb that installs mpv with it). Run it by hand for test builds (the files
# are on the run's page), or push a desktop-v* tag to release them: the release is published
# and the rolling "desktop-updates" release gets a fresh latest.json, which is what Rakki's
# Update button installs from. Installers are signed with the updater key (repository secret
# TAURI_SIGNING_PRIVATE_KEY; its public half is in tauri.conf.json), so only these builds install.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux libraries (webview, tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The desktop shares the phone app's TypeScript (../src), which needs its packages too.
      - name: Phone app packages (shared code)
        run: npm ci --ignore-scripts
      - name: Desktop packages
        working-directory: desktop
        run: npm ci

      # mpv for Windows from shinchiro's builds (the ones winget installs), put next to Rakki
      # in the installer; Linux uses the system's mpv.
      - name: mpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw 'No mpv build found' }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv-build | Out-Null
          New-Item -ItemType Directory -Force desktop/src-tauri/mpv | Out-Null
          Copy-Item mpv-build/mpv.exe desktop/src-tauri/mpv/
          Get-ChildItem mpv-build -Filter *.dll | Copy-Item -Destination desktop/src-tauri/mpv/
          Copy-Item mpv-build/doc -Destination desktop/src-tauri/mpv/doc -Recurse -ErrorAction SilentlyContinue

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx tauri build --bundles nsis --config src-tauri/tauri.mpv.conf.json
          else
            npx tauri build --bundles appimage,deb
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: rakki-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # A desktop-v* tag: publish the release, then point the Update button at it (latest.json).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: latest.json
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/`;
            const files = fs.readdirSync("dist");
            const pick = (re) => { const f = files.find((x) => re.test(x)); if (!f) throw new Error("missing " + re); return { signature: fs.readFileSync("dist/" + f + ".sig", "utf8"), url: base + encodeURIComponent(f) }; };
            const json = {
              version: tag.replace(/^desktop-v/, ""),
              notes: `Rakki desktop ${tag.replace(/^desktop-v/, "")}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": pick(/-setup\.exe$/), "linux-x86_64": pick(/\.AppImage$/) },
            };
            fs.writeFileSync("latest.json", JSON.stringify(json, null, 2));
            console.log(JSON.stringify(json.platforms, null, 1));
          '
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Rakki desktop ${{ github.ref_name }}
          make_latest: false
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
      - name: Point the Update button at it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-updates
          name: Rakki desktop updates
          body: Where Rakki desktop's Update button looks for the newest version (latest.json). Not an install page; see the desktop-v* releases.
          prerelease: true
          make_latest: false
          files: latest.json
