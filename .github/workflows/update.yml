name: Publish over-the-air update

# Every push to main that changes app code is checked, then published to the "production"
# update channel. The installed Rakki app downloads it the next time it opens (Settings →
# About → Check for updates to fetch it right away). Publishing runs here rather than on the
# dev PC because EAS uploads need decent upload speed.
#
# Needs the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).
#
# Only JS/asset changes can ship this way. An update is only delivered to builds with the same
# runtimeVersion (app.json), which names the native build: when native code or a native
# dependency changes, give runtimeVersion a new value and run "iOS build" (release), so a new
# native build never receives an incompatible update. expo.version is separate: Rakki's a.b.c
# version, bumped with each release and shown in Settings → About.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ota-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Stamped into the update so Settings → About can say which one is running.
          RAKKI_UPDATE: ${{ github.run_number }}
          RAKKI_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret is not set; skipping the update."
            exit 0
          fi
          npx eas-cli@latest update \
            --channel production \
            --environment production \
            --platform ios \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive
