name: iOS build (unsigned .ipa for SideStore)

# Manual only: Actions tab → "iOS build" → Run workflow, then pick the variant.
#   dev     → "Rakki Dev": Debug build with expo-dev-client; loads JS live from the PC.
#             Rebuild only when native code or native dependencies change.
#   release → "Rakki": the everyday app with the JS bundled in.
#   check   → the release build without publishing it: checks native changes compile while
#             the downloadable build stays as it is.
# SideStore signs the .ipa with the free Apple ID on the phone, so the build is unsigned.
# Expo SDK 57 needs Xcode 26.4+, which the macOS 26 runner provides.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which app to build
        type: choice
        options: [dev, release, check]
        default: dev

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write # publish the release .ipa to a GitHub Release
    env:
      APP_VARIANT: ${{ inputs.variant == 'dev' && 'development' || 'production' }}
      CONFIGURATION: ${{ inputs.variant == 'dev' && 'Debug' || 'Release' }}
      IPA_NAME: ${{ inputs.variant == 'dev' && 'Rakki-Dev' || inputs.variant == 'check' && 'Rakki-check' || 'Rakki' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - run: npm ci

      # Continuous Native Generation: ios/ is generated from app.json + app.config.js and never
      # committed. Prebuild also runs `pod install`.
      - run: npx expo prebuild --platform ios --clean

      - name: Build (unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME  Configuration: $CONFIGURATION"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*Rakki|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: grep -n -B2 -A6 "error:" xcodebuild.log | head -n 200 || true

      # SideStore reads each binary's entitlements to know what to set up when it signs the app
      # with the Apple ID, like the app group the widgets share with the app. An unsigned build
      # carries none, so sign it ad hoc with them (SideStore replaces the signature anyway).
      # Inside out: frameworks, then the widget extension, then the app. Push notifications are
      # removed: Rakki doesn't use them and a free Apple ID can't have them.
      - name: Embed entitlements
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          sign() {
            cp "$2" entitlements.plist
            plutil -remove aps-environment entitlements.plist 2>/dev/null || true
            codesign --force --sign - --entitlements entitlements.plist "$1"
            echo "== $(basename "$1")"; codesign -d --entitlements - --xml "$1" | plutil -p -
          }
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 | xargs -0 -I{} codesign --force --sign - {}
          for APPEX in "$APP"/PlugIns/*.appex; do
            [ -d "$APPEX" ] || continue
            NAME=$(basename "$APPEX" .appex)
            sign "$APPEX" "ios/$NAME/$NAME.entitlements"
          done
          sign "$APP" "$(find ios -maxdepth 2 -name "*.entitlements" -not -path "ios/ExpoWidgetsTarget/*" | head -n 1)"

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "App: $APP"
          ls "$APP/PlugIns" 2>/dev/null || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$IPA_NAME.ipa" Payload
          ls -lh "$IPA_NAME.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-ipa
          path: ${{ env.IPA_NAME }}.ipa
          retention-days: 30

      # Release builds also go to a fixed GitHub Release so the iPhone can download them in
      # Safari: https://github.com/LuckiRakki/rakki/releases/download/ios-latest/Rakki.ipa
      - name: Publish to GitHub Release
        if: inputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned build for SideStore. On your iPhone: download Rakki.ipa, then SideStore → My Apps → + → pick it. Code changes arrive as over-the-air updates; this file only changes when native code does."
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --title "Rakki for iPhone (latest build)" --notes "$NOTES" --prerelease
          fi
          gh release upload ios-latest "$IPA_NAME.ipa" --clobber
          # The title follows the app's version (the notes are written by hand per release).
          VERSION=$(node -p "require('./app.json').expo.version")
          gh release edit ios-latest --title "Rakki $VERSION"
