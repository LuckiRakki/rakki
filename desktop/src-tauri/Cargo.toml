[package]
name = "rakki-desktop"
version = "1.6.0"
description = "Rakki for Windows and Linux: Jellyfin music with word-by-word lyrics"
authors = ["LuckiRakki"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rakki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }
# System media controls: Windows' media overlay (SMTC) and Linux's MPRIS.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Talking to MRQ, your tag editor, and Spotify's public album pages (mrq.rs). Both already part
# of the app through the updater; rustls's ring is the encryption the updater uses too.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-single-instance = "2"

# Windows: WebView2's own settings (memory.rs); the same versions Tauri's webview already uses.
[target.'cfg(windows)'.dependencies]
# The sign-in token in Windows' Credential Manager (data.rs).
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows-core = "0.62"
# Recording mpv's sound for the visualizer (capture.rs): process loopback.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Security",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
